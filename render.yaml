# Temporary FREE test deployment of the CRM chat API on Render (see DEPLOY_RENDER_TEST.md).
# Secrets are NOT stored here: Render prompts for the `sync: false` values when you
# create the Blueprint. CHAT_API_KEY is generated by Render; read it in the dashboard.
services:
  - name: bucky-chat-test
    type: web
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: CHAT_API_KEY
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: WEAVIATE_URL
        sync: false
      - key: WEAVIATE_API_KEY
        sync: false
      - key: LLM_MODEL
        value: anthropic/claude-sonnet-5
      - key: MCP_SERVER_URL
        value: https://mcp.bucketlistt.com/mcp
      - key: MAX_MESSAGES_PER_SESSION
        value: "40"
      - key: REDIS_URL
        fromService:
          name: bucky-redis-test
          type: keyvalue
          property: connectionString

  - name: bucky-redis-test
    type: keyvalue
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []   # private network only: reachable by the web service, not the internet
