# Production compose — runs pre-built images pulled from GHCR (built in CI),
# instead of building on the EC2 box. Used by the deploy job in
# .github/workflows/ci-cd.yml. For local dev, use docker-compose.yml (which
# builds from source).
#
# The image owner is your GitHub username/org — replace `okghumo` below if
# the repo moves. Images are tagged :latest by CI; pin to a :<sha> tag here to
# roll back to a specific build.
services:
  clamav:
    # Attachment malware scanning (app/attachments.py::_scan_or_raise). The
    # virus-definition DB is large and downloads on first boot — the backend
    # can come up before this is ready to scan; _scan_or_raise fails closed
    # (503) rather than skip the scan during that window, so it's a startup
    # delay for uploads, not a security gap.
    # :latest, not a pinned version — a pinned tag (1.3) 404'd on pull in
    # practice (see commit 1fee5ef); revisit with a real pinned tag if one
    # becomes available; :latest trades reproducibility for "actually pulls."
    image: clamav/clamav:latest
    expose:
      - "3310"
    volumes:
      - clamav_data:/var/lib/clamav
    restart: unless-stopped

  weaviate:
    image: semitechnologies/weaviate:1.27.0
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      ENABLE_MODULES: ""
      CLUSTER_HOSTNAME: "node1"
      RAFT_BOOTSTRAP_EXPECT: "1"
      RAFT_JOIN: "node1"
    volumes:
      - weaviate_data:/var/lib/weaviate
    ports:
      - "8080:8080"
      - "50051:50051"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    restart: unless-stopped

  backend:
    image: ghcr.io/okghumo/aichatbot-backend:latest
    env_file: ./backend/.env
    environment:
      WEAVIATE_URL: http://weaviate:8080
      REDIS_URL: redis://redis:6379/0
      CLAMD_HOST: clamav
      CLAMD_PORT: 3310
    expose:
      - "8000"
    depends_on:
      - weaviate
      - redis
      - clamav
    restart: unless-stopped

  frontend:
    image: ghcr.io/okghumo/aichatbot-frontend:latest
    expose:
      - "80"
    depends_on:
      - backend
    restart: unless-stopped

  # Reverse proxy + automatic HTTPS for chatbot.bucketlistt.com — see ./Caddyfile.
  # Backend-only (see Caddyfile comment) — this is now the only publicly
  # exposed service; backend/frontend are reachable only from other
  # containers on this compose network. The frontend service above still
  # runs (harmless, not publicly routed) in case it's needed for internal
  # testing — safe to remove entirely once you're sure it's not needed.
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  weaviate_data:
  clamav_data:
  caddy_data:
  caddy_config:
