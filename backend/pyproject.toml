[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "chatbot-backend"
version = "0.1.0"
description = "Reusable chatbot backend (FastAPI + litellm) for customer-support or internal Q&A use cases."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "litellm==1.92.0",  # pinned: newer releases import `MCPError` (mcp v2 name) but we pin mcp<2 -> ImportError on a fresh build
    "orjson>=3.9",  # litellm imports this at runtime for streaming but doesn't declare it
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "sse-starlette>=2.1",
    # Vector DB + embedding for RAG
    "weaviate-client>=4.6",
    "openai>=1.30",
    "anthropic>=0.49",
    "mcp>=1.9,<2",
    "redis[hiredis]>=5.0",  # MCP result cache (app/cache.py) + session store (app/session_store.py) — no-ops if REDIS_URL unset
    # Attachments (app/attachments.py)
    "python-multipart>=0.0.9",   # FastAPI's file/form upload parsing
    "python-docx>=0.8.6",        # pin: 0.8.6+ has the XXE fix (CVE-2016-5851)
    "defusedxml>=0.7",           # safe XML parsing for docx extraction
    "filetype>=1.2",             # magic-byte content-type sniffing
    "clamd>=1.0",                # ClamAV daemon client
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "pylint>=3.2",
    "httpx>=0.27",
]

[tool.pylint.main]
disable = [
    "too-few-public-methods",     # pydantic BaseModel subclasses are data schemas, not OOP objects - this rule doesn't apply to them
    "missing-function-docstring", # test function names are self-documenting; forcing a docstring on every test is pure boilerplate
]

[tool.pylint.format]
max-line-length = 100
